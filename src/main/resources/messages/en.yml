prefix: "<bold><red>U</red><white>L</white> Wars<dark_gray>» </dark_gray></bold>"
reload: "<dark_green>Plugin reloaded.</dark_green>"

errors:
  generic: "<red>Could not execute the request. Check the console for details.</red>"
  invalid-war-goal: "<red>Invalid War Goal: {1}</red>"
  invalid-war-goal-targets: "The provided targets are not suitable for this war goal."
  object-not-found: "<red>Could not find {1}</red>"
  player-not-found: "<red>Player {1} is offline or doesn't exist.</red>"
  invalid-color: "<red>Invalid hex color</red>"
  no-citizen-data: "<red>Could not load your citizen data. Please contact an administrator.</red>"
  invite:
    invalid-receiver: "This receiver can't be invited to this war."
    invite-not-supported: "This type of war doesn't allow inviting others."
    receiver-must-be-country: "Only countries can be invited to this war."
    receiver-must-be-in-same-region: "Only settlements in the same region can be invited to this revolt."

admin:
  mercenary:
    add:
      limit-reached: "<red>Faction has already reached mercenary limit.</red>"
      player-in-war: "<red>Player is already in a war.</red>"
      no-military-rank: "<red>Player doesn't have a military rank.</red>"
      success: "<aqua>Added player {1} as mercenary to faction {2}.</aqua>"
    remove:
      not-mercenary: "<red>Player is not a mercenary in that faction.</red>"
      success: "<aqua>Removed player {1} as mercenary of faction {2}.</aqua>"
  military-rank:
    unknown-rank: "<red>Unknown military rank: {1}</red>"
    already-owned: "<red>{1} already has the military rank {2}.</red>"
    unique-taken: "<red>The military rank {1} is unique and already held by {2} in this country.</red>"
    add-success: "<aqua>Assigned military rank {1} to {2}.</aqua>"
    no-rank: "<red>{1} doesn't have a military rank.</red>"
    remove-success: "<aqua>Removed military rank {1} from {2}.</aqua>"

player:
  military-rank:
    not-in-country: "<yellow>You are not part of a country.</yellow>"
    no-permission: "<yellow>You don't have permission to manage military ranks in your country.</yellow>"
    target-not-in-country: "<yellow>{1} is not a citizen of your country.</yellow>"
    unknown-rank: "<yellow>Unknown military rank: {1}</yellow>"
    already-owned: "<yellow>{1} already has the military rank {2}.</yellow>"
    unique-taken: "<yellow>The military rank {1} can only be held by one citizen and is already held by {2}.</yellow>"
    add-success: "<aqua>Assigned military rank {1} to {2}.</aqua>"
    received: "<aqua>You have been assigned the military rank {1}.</aqua>"
    no-rank: "<yellow>{1} doesn't have a military rank.</yellow>"
    remove-success: "<aqua>Removed military rank {1} from {2}.</aqua>"
    lost: "<yellow>You have lost your military rank {1}.</yellow>"
  faction:
    not-faction-leader: "<red>Only faction leaders can do this.</red>"
    name-in-use: "<yellow>This name is already in use. Please choose a unique one.</yellow>"
    setcolor-success: "<aqua>Faction color changed to {1}</aqua>"
    setname-success: "<aqua>Faction name changed to {1}</aqua>"
  war:
    book:
      unknown-war-goal: "<yellow>Unknown war goal: {1}.</yellow>"
      validation-error: "<yellow>Can't create war book: {1}</yellow>"
      cost-too-high: "<warn>You don't have enough mobilisation for this. (You need {1} but have {2})</warn>"
      confirm-cost: "<gray>Creating this war declaration book will cost {1} mobilisation. Continue?</gray>"
      not-in-settlement: "<yellow>You are not part of a settlement.</yellow>"
      not-in-country: "<yellow>You are not part of a country.</yellow>"
      no-rank: "<yellow>You don't have the required settlement or country rank to do this.</yellow>"
      no-region: "<yellow>Your settlement is not in a region.</yellow>"
      target-invalid: "<yellow>Target {1} not valid for this war goal.</yellow>"
    claim-dispute:
      confirm: "<red>This region is already being claimed. If you approve this claim, you will trigger a war with the claiming country. Continue?</red>"
      validation-error: "<yellow>Can't start a claim dispute: {1}</yellow>"
    war-lives:
      lost: "<yellow>You lost a war life in {2}. Lives remaining: {1}</yellow>"
      final: "<red>You lost your last war life in {1}. You can no longer earn kill points or take part in sieges in this war.</red>"
  war-zone:
    entering: "<red>Now entering a war zone!</red>"
  warcamp:
    already-set: "<yellow>Your faction already has a war camp.</yellow>"
    not-wilderness: "<yellow>War camps can only be set up in the wilderness.</yellow>"
    war-active: "<yellow>War camps can't be set up while the war is active.</yellow>"
  invite:
    joined: "<broadcast>{1} just joined faction {2} in the war {3}!</broadcast>"
    validation-error: "<error>{1}</error>"
  mercenary:
    add:
      limit-reached: "<yellow>Your faction has already reached its mercenary limit.</yellow>"
      player-in-war: "<yellow>This player is already in a war.</yellow>"
      no-military-rank: "<yellow>This player doesn't have a military rank.</yellow>"
      success: "<aqua>Added player {1} as mercenary to {2}.</aqua>"
    remove:
      not-mercenary: "<red>This player is not a mercenary in your faction.</red>"
      success: "<aqua>Excluded player {1} from fighting for faction {2}.</aqua>"


# +---------------------------------------------+ #
# |               War Goals                     | #
# +---------------------------------------------+ #

war-goals:
  skirmish:
    display-name: "<br>                              <b><gradient:#FF5555:#AA0000>SKIRMISH</gradient></b><br>"
    description: "<gray>The attackers have declared a skirmish against <b>{1}</b>.</gray><br>"
    end-messages:
      DRAW: "The skirmish ended without a clear winner."
      ATTACKER: "The attackers have won the skirmish."
      DEFENDER: "The defenders have won the skirmish."
    validation:
      same-target: "Attacker and target are the same."
  claim-dispute:
    display-name: "<br>                            <b><gradient:#FFFFFF:#AAAAAA>CLAIM DISPUTE</gradient></b><br>"
    description: "<gray>Two or more countries are fighting over the unclaimed region of <b>{1}</b>.</gray><br>"
    end-messages:
      DRAW: "The war ended without a clear winner. The region remains uncontrolled."
      CLAIMANT: "The winning faction has seized control of the region."
    validation:
      not-claimed: "The region is not being claimed."
      already-claimant: "Your country is already claiming this region."
  conquest:
    display-name: "<br>                          <b><gradient:#FAC230:#FF9B00>REGION CONQUEST</gradient></b><br>"
    description: "<gray>The attackers have declared war to take <b>{1}</b>. Defenders may attempt a counterattack in the closest enemy region.</gray><br>"
    end-messages:
      DRAW: "The war ended without a clear winner. Nothing changes hands."
      ATTACKER: "The attackers were victorious and have taken the target region."
      DEFENDER: "The defenders have repelled the attack. The region remains under their control."
    validation:
      region-unowned: "The target region is unowned."
      region-owned-by-declarer: "The target region already belongs to your country."
  revolt:
    display-name: "<br>                               <b><gradient:#55FF55:#00AA00>REVOLT</gradient></b><br>"
    description: "<gray>A revolt has broken out in <b>{1}</b>. The rebels are fighting for their independence, or to seize the country if its capital lies in the region.</gray><br>"
    end-messages:
      DRAW: "The war ended without a clear winner. The rebels remain part of the country."
      ATTACKER: "The rebels have won the day! Their region has gained independence."
      TAKEOVER: "The rebels have seized power! Their settlement is the new capital and their mayor now leads the country."
      DEFENDER: "The uprising was crushed. The region remains under the current owner's control."
    validation:
      settlement-no-country: "Your settlement doesn't belong to a country."
      settlement-no-region: "Your settlement doesn't belong to a region."
      wrong-region: "The target region is not your settlement's region."
      region-unowned: "The target region doesn't belong to a country."
      region-other-country: "The target region doesn't belong to your settlement's country."
      capital: "A country's capital can't revolt."
  subjugation:
    display-name: "<br>                             <b><gradient:#55FFFF:#0000AA>SUBJUGATION</gradient></b><br>"
    description: "<gray>The attackers are trying to force <b>{1}</b> to join their country.</gray><br>"
    end-messages:
      DRAW: "The war ended without a clear winner. Nothing changes hands."
      ATTACKER: "The attackers were victorious and have taken the settlement."
      DEFENDER: "The defenders have repelled the attack. The settlement remains free."
    validation:
      already-in-country: "The settlement is already part of your country."
      in-other-country: "The settlement is already part of a different country."
      no-region: "The settlement is not in a region."
      region-unowned: "The settlement is in an unowned region."
      region-not-owned: "Your country doesn't own the target settlement's region."


