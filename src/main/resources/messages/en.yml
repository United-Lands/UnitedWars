# +---------------------------------------------+ #
# |               War Messages                  | #
# +---------------------------------------------+ #

info-screens:
  war-declared:
    custom-decription: "<gold><i>{1}</i></gold><br>"
    faction-header: "<white><bold>Factions in this war:</bold></white>"
    faction-entry: "  <gray><bold>{1}</bold> ({2}) <dark_gray>|</dark_gray> 🗡 {3}</gray>"
    faction-entry-maxscore: "<gray><bold>{1}</bold> ({2}) <dark_gray>|</dark_gray> 🗡 {3} / {4}</gray>"
    timer-info: "<br><gray>This war will start in: <b>{1}</b></gray>"
  war-start:
    info: "<gray>The war has started and will last {1}. Point scoring is now active.</gray><br><br><gray>Use <gold>[<aqua>/ war info {2}</aqua>]</gold> for details.</gray>"
  war-info:
    faction-entry: "<white><bold>{1}</bold> ({2}) <dark_gray>|</dark_gray> 🗡 {3}</white>"
    faction-entry-maxscore: "<white><bold>{1}</bold> ({2}) <dark_gray>|</dark_gray> 🗡 {3} / {4}</white>"
    faction-header: "<gold>                              [ <white><b>Factions</b></white> ]</gold><br><dark_gray>-------------------------------------------------</dark_gray>"
    faction-divider: "<dark_gray>-------------------------------------------------</dark_gray>"
    faction-win: "<gray><b>Victory on</b>: {1}</gray>"
    faction-lose: "<gray><b>Defeat on</b>: {1}</gray>"
    zones-header: "<br><gold>                              [ <white><b>War Zones</b></white> ]</gold>"
    zones: "{1}<br>"
    timer-info: "<gray><white><bold>This war will end in:</bold></white> {1}</gray>"
  war-end:
    info: "<gray>The war has ended with the following result:</gray><br>"
    draw: "<white><bold>DRAW</bold></white><br>"
    winner: "<white><bold>Winner: </bold></white> <gray>{1} ({2})</gray>"
    win-condition: "<white><bold>Winning condition: </bold></white> <gray>{1}</gray><br>"
    win-by-highest-score: "<white><bold>Winning condition: </bold></white> <gray>Highest score</gray><br>"
    reward: "<gray>{1}</gray>"
  war-participants:
    faction-header: "<body><bold>{1}</bold> ({2})</body>"
    faction-countries: "<body><label>Countries:</label> {1}</body>"
    faction-settlements: "<body><label>Settlements:</label> {1}</body>"
    faction-players: "<body><label>Online Players:</label> {1}</body>"

siege-bar:
  occupied: "<red>(Occupied)</red>"
  siege-disabled: "<gray>(Siege disabled)</gray>"
  owner: "Owner: {1}"
  unowned: "<gray>Unowned</gray>"
  health: " ({1}/{2})"


